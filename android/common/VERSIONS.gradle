import org.gradle.util.GradleVersion

def DEFAULT_COMPILE_SDK_VERSION = 36
def DEFAULT_BUILD_TOOLS_VERSION = "36.0.0"
def DEFAULT_TARGET_SDK_VERSION = 36
// cordova-android >= 12 (see plugin.xml <engines>) requires API 24 as the floor.
def DEFAULT_MIN_SDK_VERSION = 24
// Pinned, not a "17+" range: LocationRequest.Builder (used by ActivityRecognitionLocationProvider)
// was introduced in play-services-location 21.0.0. Must match plugin.xml GOOGLE_PLAY_SERVICES_VERSION.
def DEFAULT_PLAY_SERVICES_VERSION = "21.0.1"
def DEFAULT_ANDROIDX_CORE_VERSION = "1.13.1"
def DEFAULT_ANDROIDX_APPCOMPAT_VERSION = "1.7.0"
def DEFAULT_ANDROIDX_LOCALBROADCAST_VERSION = "1.1.0"
def DEFAULT_REACT_NATIVE_LIB_VERSION = "+"

def MOCKITO_CORE_VERSION = "5.14.2"
def ROBOLECTRIC_VERSION = "4.14.1"
def UI_AUTOMATOR_VERSION = "2.3.0"
def JUNIT_VERSION = "4.13.2"
def ANDROIDX_TEST_VERSION = "1.6.2"
def ANDROIDX_TEST_RULES_VERSION = "1.6.1"
def ANDROIDX_TEST_CORE_VERSION = "1.6.1"
def RESOURCE_PREFIX = "plugin_bgloc_"

ext {
    getApplicationId = { ->
        def applicationId = "com.marianhello.app"
        if (findProject('..:app') != null) {
            applicationId = project('..:app').android.defaultConfig.applicationId
        } else if (findProject(':app') != null) {
            applicationId = project(':app').android.defaultConfig.applicationId
        }
        if (rootProject.hasProperty('applicationId')) {
            applicationId = rootProject.applicationId
        }
        return applicationId
    }

    getAccountPrefix = { ->
        if (rootProject.hasProperty('accountPrefix')) {
            return rootProject.accountPrefix;
        }
        def applicationId = getApplicationId();
        return applicationId + '.plugin.bgloc';
    }

    getReactNativeLibVersion = { ->
        def reactNativeLibVersion = DEFAULT_REACT_NATIVE_LIB_VERSION
        if (rootProject.hasProperty('reactNativeLibVersion')) {
            reactNativeLibVersion = rootProject.reactNativeLibVersion
        }
        return reactNativeLibVersion
    }

    getPlayServicesVersion = { ->
        // Check for application-defined play-services version
        def playServicesVersion = DEFAULT_PLAY_SERVICES_VERSION
        if (rootProject.hasProperty('playServicesVersion')) {
            playServicesVersion = rootProject.playServicesVersion
        } else if (rootProject.hasProperty('googlePlayServicesVersion')) {
            playServicesVersion = rootProject.googlePlayServicesVersion
        }

        return playServicesVersion
    }

    getAndroidxCoreVersion = { ->
        def v = DEFAULT_ANDROIDX_CORE_VERSION
        if (rootProject.hasProperty('androidxCoreVersion')) {
            v = rootProject.androidxCoreVersion
        }
        return v
    }

    getAndroidxAppcompatVersion = { ->
        def v = DEFAULT_ANDROIDX_APPCOMPAT_VERSION
        if (rootProject.hasProperty('androidxAppcompatVersion')) {
            v = rootProject.androidxAppcompatVersion
        }
        return v
    }

    getAndroidxLocalBroadcastVersion = { ->
        def v = DEFAULT_ANDROIDX_LOCALBROADCAST_VERSION
        if (rootProject.hasProperty('androidxLocalBroadcastVersion')) {
            v = rootProject.androidxLocalBroadcastVersion
        }
        return v
    }

    getCompileSdkVersion = { ->
        def compileSdkVersion = DEFAULT_COMPILE_SDK_VERSION
        if (rootProject.hasProperty('compileSdkVersion')) {
            compileSdkVersion = rootProject.compileSdkVersion
        }
        return compileSdkVersion
    }

    getBuildToolsVersion = { ->
        def buildToolsVersion = DEFAULT_BUILD_TOOLS_VERSION
        if (rootProject.hasProperty('buildToolsVersion')) {
            buildToolsVersion = rootProject.buildToolsVersion
        }
        return buildToolsVersion
    }

    getTargetSdkVersion = { ->
        def targetSdkVersion = DEFAULT_TARGET_SDK_VERSION
        if (rootProject.hasProperty('targetSdkVersion')) {
            targetSdkVersion = rootProject.targetSdkVersion
        }
        return targetSdkVersion
    }

    getMinSdkVersion = { ->
        def minSdkVersion = DEFAULT_MIN_SDK_VERSION
        if (rootProject.hasProperty('minSdkVersion')) {
            minSdkVersion = rootProject.minSdkVersion
        }
        return minSdkVersion
    }

    getGradle3Support = { ->
        if (rootProject.hasProperty('gradle3EXPERIMENTAL')) {
            return true
        }
        def gradleVersionCurrent = GradleVersion.current()
        if (gradleVersionCurrent >= GradleVersion.version('4.4')) {
            println "Enabling gradle3EXPERIMENTAL support for gradle $gradleVersionCurrent"
            return true
        }
        return false
    }

    getResourcePrefix = { ->
        return RESOURCE_PREFIX
    }

    // NOTE: the plugin source uses androidx exclusively. The old com.android.support
    // coordinates here made this Gradle build unbuildable against the actual sources.
    androidLibs = [
        annotations: [group: 'androidx.annotation', name: 'annotation', version: '1.9.1'],
        coreKtx: [group: 'androidx.core', name: 'core', version: getAndroidxCoreVersion()],
        appcompat: [group: 'androidx.appcompat', name: 'appcompat', version: getAndroidxAppcompatVersion()],
        localBroadcastManager: [group: 'androidx.localbroadcastmanager', name: 'localbroadcastmanager', version: getAndroidxLocalBroadcastVersion()],
        playServicesLocation: [group: 'com.google.android.gms', name: 'play-services-location', version: getPlayServicesVersion()],
        testCore: [group: 'androidx.test', name: 'core', version: ANDROIDX_TEST_CORE_VERSION],
        testRunner: [group: 'androidx.test', name: 'runner', version: ANDROIDX_TEST_VERSION],
        testRules: [group: 'androidx.test', name: 'rules', version: ANDROIDX_TEST_RULES_VERSION],
    ]

    testLibs = [
        testRunner: [group: 'androidx.test', name: 'runner', version: ANDROIDX_TEST_VERSION],
        testRules: [group: 'androidx.test', name: 'rules', version: ANDROIDX_TEST_RULES_VERSION],
        testCore: [group: 'androidx.test', name: 'core', version: ANDROIDX_TEST_CORE_VERSION],
        // Provides androidx.test.ext.junit.runners.AndroidJUnit4, used by every androidTest class.
        // It was never declared, so the whole instrumented suite failed to compile.
        testExtJunit: [group: 'androidx.test.ext', name: 'junit', version: '1.2.1'],
        uiautomator: [group: 'androidx.test.uiautomator', name: 'uiautomator', version: UI_AUTOMATOR_VERSION],
        junit: [group: 'junit', name: 'junit', version: JUNIT_VERSION],
        json: [group: 'org.json', name: 'json', version: '20231013'],
        mockitoCore: [group: 'org.mockito', name: 'mockito-core', version: MOCKITO_CORE_VERSION],
        robolectric: [group: 'org.robolectric', name: 'robolectric', version: ROBOLECTRIC_VERSION],
    ]

    libs = [
        reactNative: [group: 'com.facebook.react', name: 'react-native', version: getReactNativeLibVersion()],
        // Must match android/dependencies.gradle, which is what production builds actually use.
        permissions: [group: 'io.github.nishkarsh', name: 'android-permissions', version: '2.1.8'],
        logback: [group: 'com.github.tony19', name: 'logback-android', version: '1.1.1-9'],
        slf4j: [group: 'org.slf4j', name: 'slf4j-api', version: '1.7.21'],
        promise: [group: 'com.github.jparkie', name: 'promise', version: '1.0.3'],
    ]
}
